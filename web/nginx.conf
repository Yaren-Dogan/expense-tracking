server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: the browser never talks to the API container directly, so no CORS is needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A local model on CPU can take minutes for an assistant answer; nginx's 60 s default would cut it off.
        proxy_read_timeout 300s;
    }

    # The service worker must always be revalidated or users get stuck on an old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current JS bundle; caching it would keep old code running after an update.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
