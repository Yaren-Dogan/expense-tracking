services:
  postgres:
    # pgvector adds the vector type and similarity search used by the AI features.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      # Local development only; production credentials come from a secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=expense_tracker;Username=expense;Password=${POSTGRES_PASSWORD:-expense_dev}
      Database__MigrateOnStartup: "true"
      Clock__TimeZone: Europe/Istanbul
      Ai__Endpoint: http://ollama:11434
      Ai__ChatModel: ${CHAT_MODEL:-qwen2.5:3b}
      Ai__EmbeddingModel: bge-m3
      # Planned works with small local models; switch to Native for a capable model (e.g. qwen2.5:7b and up).
      Ai__AgentMode: ${AGENT_MODE:-Planned}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # The API starts without the models; AI endpoints return 503 until they are downloaded.
      ollama:
        condition: service_started

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      # The API waits for a healthy database and migrates on start; /health reports readiness.
      - api

  # Local LLM runtime. The first start downloads the models (~3 GB) through the ollama-models job below.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # One-off job: pulls the chat and embedding models, then exits. Re-running it is cheap once they are cached.
  ollama-models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    # Waits for the server, since depends_on only orders container starts.
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${CHAT_MODEL:-qwen2.5:3b} && ollama pull bge-m3"]
    depends_on:
      - ollama
    restart: "no"

  # Browser UI for looking at the database during development: http://localhost:8081
  adminer:
    image: adminer:4
    # The image listens on [::] by default, which fails on hosts without IPv6.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  ollama:
