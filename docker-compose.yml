services:
  postgres:
    # pgvector adds the vector type and similarity search used by the AI features.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      # Local development only; production credentials come from a secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=expense_tracker;Username=expense;Password=${POSTGRES_PASSWORD:-expense_dev}
      Database__MigrateOnStartup: "true"
      Clock__TimeZone: Europe/Istanbul
      # AI provider. Default: Google Gemini's free tier through its OpenAI-compatible API (nothing downloaded locally).
      # Put AI_API_KEY in .env. For local models instead: AI_PROVIDER=Ollama, AI_ENDPOINT=http://ollama:11434,
      # CHAT_MODEL=qwen2.5:3b, EMBEDDING_MODEL=bge-m3 and start with --profile ollama.
      Ai__Provider: ${AI_PROVIDER:-OpenAICompatible}
      Ai__Endpoint: ${AI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__ChatModel: ${CHAT_MODEL:-gemini-3.5-flash-lite}
      Ai__EmbeddingModel: ${EMBEDDING_MODEL:-gemini-embedding-001}
      # Planned: the app runs the tool loop using schema-constrained JSON; works with every provider.
      # Native uses the provider's own tool calling. Gemini 3.x fails it through the OpenAI-compatible API
      # (it requires a "thought signature" to be echoed back, which OpenAI clients drop), so Planned is the default.
      Ai__AgentMode: ${AGENT_MODE:-Planned}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      # The API waits for a healthy database and migrates on start; /health reports readiness.
      - api

  # Optional local LLM runtime (~3.75 GB image + ~3 GB models). Only started with: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

  # One-off job: pulls the chat and embedding models, then exits. Re-running it is cheap once they are cached.
  ollama-models:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: ollama:11434
    # Waits for the server (depends_on only orders container starts), then pulls each model with retries:
    # large downloads over home connections drop now and then, and Ollama resumes a partial pull.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for model in ${CHAT_MODEL:-qwen2.5:3b} bge-m3; do
          for attempt in 1 2 3 4 5; do
            ollama pull "$$model" && break
            echo "Pull of $$model failed (attempt $$attempt/5), retrying in 5 s..."
            sleep 5
          done
          ollama list | grep -q "^$${model%%:*}" || { echo "Could not download $$model"; exit 1; }
        done
        echo "Models ready."
    depends_on:
      - ollama
    restart: "no"

  # Browser UI for looking at the database during development: http://localhost:8081
  adminer:
    image: adminer:4
    # The image listens on [::] by default, which fails on hosts without IPv6.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  ollama:
